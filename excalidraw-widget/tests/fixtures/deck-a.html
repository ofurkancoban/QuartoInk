<script>
// Minimal stand-in for Bootstrap tabs: toggles the active tab and pane on click.
document.addEventListener('click', function (e) {
  var tab = e.target.closest('[data-bs-toggle="tab"]');
  if (!tab) return;
  e.preventDefault();
  var list = tab.closest('[role="tablist"]');
  list.querySelectorAll('[role="tab"]').forEach(function (t) {
    var on = t === tab;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    var pane = document.querySelector(t.getAttribute('href'));
    if (pane) pane.classList.toggle('active', on);
  });
  tab.dispatchEvent(new Event('shown.bs.tab', { bubbles: true }));
});
</script>
